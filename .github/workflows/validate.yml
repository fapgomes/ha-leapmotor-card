name: validate

# A workflow of its own, rather than a job inside build.yml, for three reasons:
#
#  1. build.yml's `on:` exists to serve the `release` job: it is limited to
#     `branches: [main]` plus `tags: ['v*']`. A HACS job in there would inherit
#     that trigger — it would not run on pushes to any other branch, which is
#     where a regression shows up first, and it would run on tag pushes, which
#     is precisely where it must not run (see point 3).
#  2. `hacs/action` builds nothing. It asks the GitHub API about the published
#     repository, at the given ref; it needs no checkout, no Node and no
#     `dist/`. It has nothing to share with the jobs that build, and a `needs:`
#     between them would only delay the result.
#  3. Tag pushes are left out deliberately. HACS resolves hacs.json's `filename`
#     from the release assets first and only then from the repository tree; as
#     `dist/` is in .gitignore, at the instant of the tag push the asset does
#     not exist yet — the one that publishes it is build.yml's `release` job,
#     immediately afterwards. Validating there would be a race against our own
#     release, lost on every tag. Branch pushes and pull requests catch the
#     regression before a tag is ever cut, which is what we want.
#
# The daily `schedule` catches what no push can: a change in HACS's own
# requirements, which fails this repository without anything here having been
# touched. It is in the action's documented example.
#
# `@main` rather than a tag: `hacs/action`'s latest tag is 22.5.0, from May
# 2022, and that tag's `action.yml` still points at
# `docker://ghcr.io/hacs/action:main`. Pinning the tag pins no version at all —
# it gives the same image, with an older `action.yml` in front of it.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      # `category: plugin` is HACS's internal value for a dashboard card. The
      # interface shows it as "Dashboard", but the API — and this action —
      # still call it `plugin`.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
