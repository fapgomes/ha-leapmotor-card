name: build

on:
  push:
    # `tags` é obrigatório: sem ele o workflow não corre num push de tag, e o
    # job `release`, que depende de `refs/tags/v*`, nunca dispara — deixando o
    # repositório sem asset e portanto não instalável por HACS.
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release:
    # `dist/` está no .gitignore, logo o ficheiro não existe na árvore do repo.
    # O HACS resolve o `filename` do hacs.json primeiro a partir de um asset de
    # release e só depois da árvore: sem este job, nenhuma das duas vias tem o
    # ficheiro e o repositório não é instalável.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # O corpo da release sai do CHANGELOG, e não de notas automáticas: quem
      # instala por HACS lê isto na página da release, e a lista de commits não
      # lhe diz o que mudou no card. Sem `body`, a acção publica o asset e um
      # corpo vazio — foi o que aconteceu na 0.4.0, 0.4.1 e 0.4.2.
      - name: Extrair as notas da versão do CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          # Falhar aqui é melhor do que publicar um corpo vazio outra vez.
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/leapmotor-card.js
          body_path: release-notes.md
